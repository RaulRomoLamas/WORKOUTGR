<aside class="sidebar">
  <p class="eyebrow">Panel {{ rol | titlecase }}</p>

  <nav>
    <a
      *ngFor="let item of menuVisible()"
      [routerLink]="item.ruta"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.ruta === '/dashboard' }">
      {{ item.texto }}
    </a>
  </nav>

  <button type="button" (click)="salir()">Cerrar sesion</button>
</aside>
